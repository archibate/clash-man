[package]
name = "clash-man"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A keyboard-first Clash/Mihomo controller dashboard"
license = "MIT"

[dependencies]
clap = { version = "4.6.3", features = ["derive", "env"] }
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.32"
ratatui = "0.30.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml_ng = "0.10.0"
thiserror = "2.0.18"
tokio = { version = "1.53.0", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
url = "2.5.8"

[dev-dependencies]
axum = "0.8.8"

[profile.release]
lto = "thin"
strip = true
